name: Chrome extension

# Every pull request and every push to main: build the extension, smoke-test it in Chromium and keep the zip as a downloadable
# artifact on the run (a test build, no release needed). On main or a tag like v1.0.1, if the extension's version has no
# GitHub Release yet, the zip is published as one. The userscripts themselves are not bundled by hand: the build copies them from the repo root.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release on a tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "EXT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: node scripts/build-extension.js

      - name: Install test browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm test

      - name: Upload zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: elm451-dedup-tools
          path: dist/*.zip
          if-no-files-found: error

      # A release is made when the extension's own version has no release yet: either a pushed tag (vX.Y.Z), or a push
      # to main whose extension/manifest.json version is new. So releasing = bump the version in manifest.json and merge.
      # (A merge that only changes the userscripts needs no release: they update themselves from main.)
      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v$(node -p "require('./extension/manifest.json').version")"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          UI=$(grep -m1 '@version' Element451-UI-Perfection-v2.user.js | awk '{print $3}')
          DB=$(grep -m1 '@version' database-v2.js | awk '{print $3}')
          MERGE=$(grep -m1 '@version' database-merge-v2.js | awk '{print $3}')
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --title "Element451 Dedup Tools $TAG" \
            --notes "Chrome extension (unpacked). Bundled scripts: UI Perfection v$UI, Database v$DB, Database Merge v$MERGE. The scripts also update themselves from GitHub when Chrome starts; this zip is only needed to install or to update the extension itself. See the README for install steps."
